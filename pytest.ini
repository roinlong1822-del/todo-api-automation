[pytest]
# 仓库根跑 pytest:`pythonpath` 相对 rootdir。
#   api_test → 用例可以 `from api.auth_api import AuthApi`、`from config.loader import ...`
#   .        → 用例可以 `import api_server...`(双端校验要直连数据库时用)
pythonpath = api_test .
# 默认收集范围
testpaths = api_test
# 实验区与历史归档不参与自动收集(要跑需显式指定路径)
norecursedirs = api_test/scratch api_test/archive .git __pycache__
markers =
    network: 依赖外部网络的用例(CI 上用 -m "not network" 跳过)

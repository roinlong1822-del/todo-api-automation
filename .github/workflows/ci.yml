name: CI

# 触发条件:推 main、提 PR、手动跑
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # 卡住时不要白等 6 小时

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip               # 缓存 pip 包,加速后续流水线

      - name: 装依赖
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements-dev.txt

      - name: 初始化数据库
        run: python -m api_server.app.seed

      - name: 启动被测服务
        run: |
          python -m uvicorn api_server.app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs > /dev/null; then
              echo "服务已就绪"; exit 0
            fi
            sleep 1
          done
          echo "❌ 服务启动失败"
          cat uvicorn.log
          exit 1

      - name: 跑用例(排除 network 标记)
        run: pytest -q -m "not network"

      - name: 契约冒烟(45 项)
        run: python scripts/contract_smoke.py

      - name: 代码规范
        run: ruff check .

      - name: 上传日志(成功失败都传,便于排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            api_test/logs/run.log
            uvicorn.log
          if-no-files-found: ignore

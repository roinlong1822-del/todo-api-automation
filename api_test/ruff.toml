# ruff 配置:静态检查 + 格式化(命名规范由 N 规则自动强制)
# 用法:ruff check . / ruff check --fix . / ruff format .

line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle 错误(缩进、空白、行太长等)
    "W",   # pycodestyle 警告
    "F",   # pyflakes(未使用的导入/变量、未定义名字)
    "I",   # isort:import 排序
    "N",   # pep8-naming:类名大驼峰、函数变量小写下划线、常量全大写
    "UP",  # pyupgrade:用新语法替代旧写法
    "B",   # flake8-bugbear:常见坑(可变默认参数等)
    "SIM", # flake8-simplify:可简化的写法
]
ignore = [
    "E501",  # 行长度交给 ruff format 处理,不单独报错
]

[lint.per-file-ignores]
# 测试文件允许:长函数名、断言里的魔法数字
"test_*.py" = ["N802", "PLR2004"]
